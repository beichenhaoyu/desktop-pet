[package]
name = "desktop-pet"
version = "0.1.0"
description = "Plugin-driven Windows desktop pet"
authors = ["DesktopPet"]
edition = "2021"

[lib]
# `_lib` 后缀避免 Windows 上 lib 名与 bin 名冲突，见 https://github.com/rust-lang/cargo/issues/8519
name = "desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 打包体积优化，见 https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
