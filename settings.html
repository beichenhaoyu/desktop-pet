<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DesktopPet 设置</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>插件管理</h1>
        <p class="hint">启停即时生效；未授权能力首次调用时会弹出确认框</p>
      </header>
      <main id="plugin-list"></main>
      <section id="game-mode" class="agent-box">
        <h2>游戏模式</h2>
        <label class="agent-row">
          <input type="checkbox" id="game-mode-switch" class="switch" />
          有应用全屏时自动隐身
        </label>
        <p class="hint" id="game-mode-status"></p>
        <p class="hint">
          隐身只收起宠物窗：动画、点击穿透轮询与自言自语一并停掉，插件的功能（蓝牙、事件、存储）照常运行。
          关掉这个开关就不再轮询前台窗口。
        </p>
      </section>
      <section id="agent-hook" class="agent-box">
        <h2>Agent 事件接入</h2>
        <p class="hint" id="agent-status">正在读取状态…</p>
        <p class="hint" id="agent-detail"></p>
        <div class="agent-actions">
          <button type="button" id="agent-install">安装 Qoder hook</button>
          <button type="button" id="agent-uninstall">卸载</button>
          <button type="button" id="agent-refresh">刷新</button>
        </div>
        <p class="hint">
          安装会往 ~/.qoder/settings.json 与 ~/.qoder-cn/settings.json 追加本宠物的 hook
          条目（首次改动会留 .pre-pet-backup 备份），只增删自己的条目，不动其他 hook。
          装好后 Agent 的工具调用、等待确认、任务完成等事件就会驱动宠物。
        </p>
      </section>
    </div>
    <script type="module" src="/src/settings/main.ts"></script>
  </body>
</html>
